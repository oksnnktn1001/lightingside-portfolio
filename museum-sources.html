<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Исходники залов — Музей о море</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#0c171d;color:#e8eff1}
    *{box-sizing:border-box}
    body{margin:0;background:#0c171d}
    header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:24px;align-items:flex-start;padding:22px 28px;background:rgba(12,23,29,.94);border-bottom:1px solid #61757d;backdrop-filter:blur(12px)}
    h1{font-size:clamp(22px,3vw,42px);font-weight:400;margin:0;letter-spacing:-.03em}
    header p{max-width:660px;margin:2px 0 0;color:#aec0c6;line-height:1.45}
    main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#61757d;padding:1px}
    figure{margin:0;background:#0c171d;padding:18px}
    img{display:block;width:100%;height:min(46vw,560px);object-fit:contain;background:#071014}
    figcaption{display:flex;justify-content:space-between;gap:16px;padding-top:12px;font-size:18px}
    figcaption b{font-weight:500;color:#fff}
    figcaption span{font-family:monospace;color:#7fd6eb}
    @media(max-width:780px){header{position:static;display:block}header p{margin-top:10px}main{grid-template-columns:1fr}img{height:auto;max-height:70vh}}
  </style>
</head>
<body>
  <header>
    <h1>Исходники залов</h1>
    <p>Назовите соответствия в формате: «зал 1 — zone-02, зал 2 — zone-04…». На схеме отмечено 9 залов, а исходных визуализаций сейчас 8 — отдельно скажите, для какого зала пока нет изображения.</p>
  </header>
  <main>
    <figure><img src="img/museum/zone-01.webp" alt="Исходник zone-01"><figcaption><b>Водная среда</b><span>zone-01</span></figcaption></figure>
    <figure><img src="img/museum/zone-02.webp" alt="Исходник zone-02"><figcaption><b>Вход и навигация</b><span>zone-02</span></figcaption></figure>
    <figure><img src="img/museum/zone-03.webp" alt="Исходник zone-03"><figcaption><b>Маяк / панорама</b><span>zone-03</span></figcaption></figure>
    <figure><img src="img/museum/zone-04.webp" alt="Исходник zone-04"><figcaption><b>Парус</b><span>zone-04</span></figcaption></figure>
    <figure><img src="img/museum/zone-05.webp" alt="Исходник zone-05"><figcaption><b>Ходовая рубка</b><span>zone-05</span></figcaption></figure>
    <figure><img src="img/museum/zone-06.webp" alt="Исходник zone-06"><figcaption><b>Ледовый маршрут</b><span>zone-06</span></figcaption></figure>
    <figure><img src="img/museum/zone-07.webp" alt="Исходник zone-07"><figcaption><b>Корабль в разрезе</b><span>zone-07</span></figcaption></figure>
    <figure><img src="img/museum/zone-08.webp" alt="Исходник zone-08"><figcaption><b>Машина и человек</b><span>zone-08</span></figcaption></figure>
  </main>
</body>
</html>
