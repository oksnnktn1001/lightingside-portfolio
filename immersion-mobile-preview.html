<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пространство погружения — мобильный просмотр</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111820;
      color: #eef7ff;
      font-family: Arial, sans-serif;
    }
    .preview { width: min(100%, 390px); }
    .label {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .65;
    }
    .phone {
      width: 100%;
      height: min(844px, calc(100vh - 78px));
      min-height: 600px;
      overflow: hidden;
      border: 1px solid rgba(205, 232, 255, .35);
      border-radius: 28px;
      background: #061724;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .5);
    }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <main class="preview">
    <p class="label">390 × 844 · мобильная версия</p>
    <div class="phone">
      <iframe id="project" src="./projects/immersion.html?fix=cards" title="Пространство погружения — мобильная версия" onload="setTimeout(() => this.contentDocument.getElementById('cues')?.scrollIntoView(), 900)"></iframe>
    </div>
  </main>
</body>
</html>
